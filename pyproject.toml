[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-agent"
version = "0.1.0"
description = "OpenRouter-powered job discovery and application tailoring pipeline"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "python-docx>=1.1.2",
  "pandas>=2.2.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
]

[project.scripts]
talent-agent = "talent_agent.cli:main"

[tool.setuptools.packages.find]
include = ["talent_agent*"]
